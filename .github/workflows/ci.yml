name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-tests:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Validate plugin manifests
        shell: pwsh
        run: |
          python -m json.tool plugins/bim-bridge/.codex-plugin/plugin.json > $null
          python -m json.tool kimi.plugin.json > $null
          python -m json.tool plugins/bim-bridge/release-manifest.json > $null
          python -m json.tool protocol/v1/baseline.json > $null
          python -m json.tool protocol/v2/aec-contract.schema.json > $null
          python -m json.tool .agents/plugins/marketplace.json > $null

      - name: Run installer contract tests
        shell: powershell
        run: .\tests\installer\Test-BimBridgeInstaller.ps1

      - name: Validate BIM Bridge listing logo
        shell: powershell
        run: .\tests\branding\Test-BimBridgeLogo.ps1

      - name: Validate Repo Marketplace install contract
        shell: powershell
        run: .\tests\plugin\Test-BimBridgeRepoInstall.ps1

      - name: Validate WorkBuddy adapter
        shell: powershell
        run: .\tests\adapters\workbuddy\Test-WorkBuddyAdapter.ps1

      - name: Validate Kimi adapter
        shell: powershell
        run: .\tests\adapters\kimi\Test-KimiAdapter.ps1

      - name: Run architecture contract tests
        shell: powershell
        run: |
          .\tests\architecture\Test-RevitVersionArchitecture.ps1
          .\tests\architecture\Test-RevitRuntimeResolution.ps1

      - name: Run runtime, protocol, and adapter tests
        run: |
          python -m unittest discover -s tests/runtime -p "test_*.py"
          python -m unittest discover -s tests/protocol -p "test_*.py"
          python -m unittest discover -s tests/adapters -p "test_*.py"

      - name: Run MCP tests
        run: python -m unittest discover -s tests/mcp -p "test_*.py"

      - name: Run shared bridge tests
        run: dotnet run --project tests/BimBridge.Host.Tests -c Release -f net10.0

      - name: Verify repository does not track Autodesk binaries
        shell: pwsh
        run: |
          $blocked = git ls-files | Where-Object { $_ -match '\.(dwg|dxf|bak|dwl2?|dll|exe|pdb|pfx|p12)$' }
          if ($blocked) {
            $blocked | Write-Error
            throw 'Repository contains a blocked binary or local artifact.'
          }
